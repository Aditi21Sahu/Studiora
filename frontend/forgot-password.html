<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Reset Password — Studiora</title>
  <link rel="icon" type="image/png" href="/assets/studiora-logo.png" />
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body style="min-height: 100vh; display: flex; align-items: center; justify-content: center; background-color: var(--bg-cream); padding: 2rem;">

  <div class="auth-form-card" style="max-width: 440px;">
    <div style="text-align: center; margin-bottom: 2rem;">
      <a href="/" style="display: inline-flex; align-items: center; gap: 0.75rem; text-decoration: none;">
        <img src="/assets/studiora-logo.png" alt="Studiora Logo" style="width: 40px; height: 40px;" />
        <span style="font-family: 'Playfair Display', Georgia, serif; font-style: italic; font-weight: 700; font-size: 1.4rem; color: var(--primary-dark-teal);">Studiora</span>
      </a>
      <h2 style="font-size: 1.45rem; font-weight: 800; color: var(--text-dark); margin-top: 1.25rem;">Reset Password</h2>
      <p style="font-size: 0.85rem; color: var(--text-secondary); margin-top: 0.25rem;">Enter your email to receive recovery instructions</p>
    </div>

    <!-- Alert boxes -->
    <div id="error-message" style="display: none; background-color: var(--error-bg); color: var(--error); border: 1px solid var(--error); border-radius: var(--radius-md); padding: 0.75rem 1rem; font-size: 0.85rem; margin-bottom: 1.25rem;"></div>
    <div id="success-message" style="display: none; background-color: var(--success-bg); color: var(--success); border: 1px solid var(--success); border-radius: var(--radius-md); padding: 0.75rem 1rem; font-size: 0.85rem; margin-bottom: 1.25rem;"></div>

    <form id="forgot-password-form">
      <div class="form-group">
        <label class="form-label" for="email">Email address</label>
        <input type="email" id="email" class="form-control" placeholder="you@example.com" required autocomplete="email" />
      </div>

      <button type="submit" id="submit-btn" class="btn btn-primary" style="width: 100%; margin-top: 0.75rem;">
        Send Reset Link
      </button>
    </form>

    <div style="text-align: center; margin-top: 1.75rem; font-size: 0.85rem; color: var(--text-secondary);">
      Remember your password? 
      <a href="/login.html" style="font-weight: 700; color: var(--primary-dark-teal);">Return to Sign In</a>
    </div>
  </div>

  <script src="/js/api.js"></script>
  <script src="/js/auth.js"></script>
</body>
</html>
