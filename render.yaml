services:
  - type: web
    name: studiora
    runtime: python
    region: oregon
    plan: free
    branch: main
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: "3.13"
      - key: GROQ_API_KEY
        sync: false
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: GROQ_TEXT_MODEL
        value: "llama-3.3-70b-versatile"
      - key: GROQ_STT_MODEL
        value: "whisper-large-v3-turbo"
